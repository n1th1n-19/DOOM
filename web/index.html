<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  canvas { background: #111; image-rendering: pixelated; outline: none; }
  #status { min-height: 1.4em; text-align: center; }
  #status.error { color: #ff6b6b; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<script>
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');

  // Render size: ?h=720 (default) and ?w= (default: the window's aspect, 4:3 .. 8:3).
  const q = new URLSearchParams(location.search);
  const H = Math.max(240, Math.min(1200, +q.get('h') || 720));
  const aspect = Math.min(8 / 3, Math.max(4 / 3, innerWidth / Math.max(1, innerHeight - 60)));
  const W = Math.min(1920, (+q.get('w') || Math.round(H * aspect)) & ~1);
  function fit() {
    const k = Math.min(innerWidth / W, (innerHeight - 60) / H);
    canvas.style.width = Math.floor(W * k) + 'px';
    canvas.style.height = Math.floor(H * k) + 'px';
  }
  fit(); addEventListener('resize', fit);

  var Module = {
    arguments: ['-width', String(W), '-height', String(H)],
    canvas: canvas,
    // doom.data/doom.wasm sit in build/, but the page lives one level up
    locateFile: (p) => 'build/' + p,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    setStatus: (t) => { if (t) status.textContent = t; },
    onRuntimeInitialized: () => { status.textContent = 'Click the game to capture the mouse. WASD-free: arrows move, Ctrl fire, Space use, Shift run.'; },
    onDoomError: (msg) => { status.className = 'error'; status.textContent = 'DOOM error: ' + msg; },
    onDoomQuit: () => { status.textContent = 'Game exited. Reload to play again.'; },
  };
</script>
<script src="build/doom.js"></script>
</body>
</html>
